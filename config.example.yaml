# ====================================================================
# SYNTECK INDUSTRIAL EDGE GATEWAY - CONFIGURACIÓN AWS IOT
# Target: Raspberry Pi 3 (ARMv8 1GB RAM) & PC Local (Windows/Linux)
# Runtime: Python 3 Nativo (Sin Docker, Sin venv)
# ====================================================================

gateway:
  id: "SN-D1PKP3UHM"                      # Thing Name / Client ID en AWS IoT Core
  name: "Gateway Central Raspberry Pi 3"
  partner: "inmapro"
  client: "admin"
  plant_slug: "eficienciaenergeticahome"
  heartbeat_interval_sec: 15
  log_level: "INFO"

# ── ENLACE SEGURO A AWS IOT CORE (NORTHBOUND) ───────────────────────
northbound:
  aws_iot:
    enabled: true
    endpoint: "a1uw1qi4z3nyi4-ats.iot.us-east-1.amazonaws.com"
    # Puerto 443 con TLS ALPN (x-amzn-mqtt-ca): Permite atravesar firewalls
    # industriales que bloquean el puerto 8883 sin pedir permisos a IT.
    port: 443
    certs_dir: "certs"
    cert_file: "SN-D1PKP3UHM-cert.pem.crt"
    key_file: "SN-D1PKP3UHM-private.pem.key"
    root_ca_file: "AmazonRootCA1.pem"
    keepalive: 30

# ── OBSERVABILIDAD Y SALUD DEL NODO EDGE ─────────────────────────────
observability:
  enabled: true
  publish_interval_sec: 60       # Intervalo del reporte completo de salud
  include_in_telemetry: true     # Agrega métricas vitales (CPU temp, RAM, undervoltage) en cada paquete
  thresholds:
    cpu_temp_warning_c: 75.0     # Advertir si la Pi 3 supera 75°C
    cpu_temp_critical_c: 82.0    # Crítico antes del throttling térmico (85°C)
    ram_warning_pct: 85.0        # Advertir si el consumo de RAM supera 85%
    disk_warning_pct: 90.0       # Advertir si la tarjeta MicroSD está casi llena

# ── BUFFER LOCAL Y STORE & FORWARD (RESILIENCIA SIN INTERNET) ───────
store_and_forward:
  db_path: "data/buffer.db"
  max_records: 200000
  batch_size: 50
  flush_interval_sec: 2.0
  wal_mode: true

# ── MOTOR DE INTELIGENCIA Y REGLAS EN EL BORDE (EDGE RULES) ─────────
rule_engine:
  deadband_percent: 0.2          # Report by exception
  force_publish_sec: 30          # Heartbeat forzado si no hay cambios
  alarms:
    - id: "ALM_TEMP_CALDERA_ALTA"
      tag: "caldera_temp"
      condition: ">"
      threshold: 95.0
      severity: "CRITICAL"
      message: "Temperatura de caldera excede límite seguro (95°C)"

# ── ADQUISICIÓN DE CAMPO (SOUTHBOUND DRIVERS) ────────────────────────
drivers:
  modbus_tcp: []
  modbus_rtu: []
  rpi_gpio:
    enabled: false
    pins: []

# ── PANEL WEB LOCAL Y API REST EMBEBIDA ───────────────────────────────
web:
  enabled: true
  host: "0.0.0.0"
  port: 5000
  title: "Synteck Intelligent Edge Gateway"
